<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convertitore SI → Imperiale · G. Evangelista</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@300;400;500&display=swap');

  :root {
    --bg:        #080808;
    --bg2:       #0f0f0f;
    --bg3:       #161616;
    --panel:     #111111;
    --border:    #242424;
    --border-hi: #383838;
    --accent:    #cccccc;
    --white:     #f0f0f0;
    --dim:       #484848;
    --dim2:      #2e2e2e;
    --text:      #e0e0e0;
    --text-mid:  #888888;
    --text-dim:  #4a4a4a;
    --amber:     #c4a03a;
    --amber-lo:  #6a5520;
    --green:     #5a9e5a;
    --green-lo:  #1e3a1e;
    --shadow:    rgba(0,0,0,0.8);
    --grid:      rgba(255,255,255,0.025);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--text);
    overflow-x: hidden;
  }

  /* grid bg */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
  }

  /* vignette */
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 45%, rgba(0,0,0,0.65) 100%);
    pointer-events: none;
  }

  /* ══ INSTRUMENT BAR ══════════════════════════ */
  .instrument-bar {
    position: relative; z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    height: 42px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-mid);
    letter-spacing: 0.1em;
    gap: 1rem;
  }

  .ibar-l { display: flex; align-items: center; gap: 1.4rem; flex-wrap: nowrap; }
  .ibar-r { flex-shrink: 0; }

  .ib-item { display: flex; align-items: center; gap: 0.45em; }
  .ib-k { color: var(--text-dim); font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; }
  .ib-v { color: var(--accent); }

  .sep { color: var(--dim2); user-select: none; }

  .status-led {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #4caf50;
    box-shadow: 0 0 7px #4caf50;
    animation: blink 2.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .clock {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.1rem;
    letter-spacing: 0.12em;
    color: var(--amber);
    background: rgba(196,160,58,0.07);
    border: 1px solid var(--amber-lo);
    padding: 0.18rem 0.8rem;
    border-radius: 3px;
  }

  /* ══ HEADER ══════════════════════════════════ */
  header {
    position: relative; z-index: 2;
    text-align: center;
    padding: 2.8rem 1rem 2rem;
    border-bottom: 1px solid var(--border);
  }

  .hdr-eyebrow {
    display: inline-block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 0.25rem 1.4rem;
    border-radius: 2px;
    margin-bottom: 1.1rem;
    background: var(--bg3);
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 200;
    font-size: clamp(2.2rem, 6vw, 4rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--white);
    line-height: 1;
  }

  h1 b { font-weight: 700; }
  h1 .div { color: var(--dim); font-weight: 200; margin: 0 0.2em; }

  .hdr-meta {
    margin-top: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.8rem;
    flex-wrap: wrap;
  }

  .meta-pill {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }
  .meta-pill b { color: var(--text-mid); font-weight: normal; }

  .author-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--amber);
    border: 1px solid var(--amber-lo);
    background: rgba(196,160,58,0.05);
    padding: 0.22rem 1rem;
    border-radius: 3px;
  }

  /* ══ TABS ════════════════════════════════════ */
  .tabs-wrap {
    position: relative; z-index: 2;
    overflow-x: auto;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .tabs-wrap::-webkit-scrollbar { display: none; }

  .tabs { display: flex; min-width: max-content; }

  .tab-btn {
    border: none;
    border-right: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.7rem 1.3rem;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
    position: relative;
  }
  .tab-btn:hover { background: var(--bg3); color: var(--text-mid); }
  .tab-btn.active {
    background: var(--bg3);
    color: var(--white);
  }
  .tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--white);
  }
  .tab-icon { margin-right: 0.35em; }

  /* ══ MAIN ════════════════════════════════════ */
  main {
    position: relative; z-index: 2;
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.2rem 5rem;
  }

  .category-panel { display: none; animation: fadein 0.22s ease; }
  .category-panel.active { display: block; }
  @keyframes fadein { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }

  /* panel header */
  .ph {
    display: flex; align-items: center; gap: 1rem;
    padding-bottom: 1rem; margin-bottom: 1.6rem;
    border-bottom: 1px solid var(--border);
  }
  .ph-icon {
    width: 38px; height: 38px;
    background: var(--bg3); border: 1px solid var(--border-hi);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
  }
  .ph-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.3rem; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--white);
  }
  .ph-count {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem; color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  /* ══ CARDS ═══════════════════════════════════ */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--dim2);
    border-radius: 4px;
    padding: 1.3rem 1.5rem;
    margin-bottom: 2px;
    transition: border-left-color 0.15s, background 0.15s;
    position: relative;
  }
  .card:hover {
    background: #141414;
    border-left-color: var(--accent);
  }

  .card-hdr {
    display: flex; align-items: center; gap: 0.7rem;
    margin-bottom: 1rem;
  }
  .c-icon { color: var(--text-dim); font-size: 0.85rem; width: 20px; text-align: center; }
  .c-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.98rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent);
  }
  .c-dir {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.58rem; color: var(--text-dim);
    letter-spacing: 0.12em;
    background: var(--bg3); border: 1px solid var(--border);
    padding: 0.12rem 0.5rem; border-radius: 2px;
  }

  /* input row */
  .inp-row {
    display: grid;
    grid-template-columns: 1fr 38px 1fr;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 0.9rem;
  }
  .fld { display: flex; flex-direction: column; gap: 0.28rem; }
  .fld-lbl {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .fld-inp {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.3rem;
    color: var(--white);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0.45rem 0.75rem;
    outline: none;
    width: 100%;
    transition: border-color 0.15s;
    -moz-appearance: textfield;
  }
  .fld-inp::-webkit-outer-spin-button,
  .fld-inp::-webkit-inner-spin-button { -webkit-appearance: none; }
  .fld-inp:focus { border-color: var(--accent); background: #0c0c0c; }

  .fld-unit {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.58rem; color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .fld-inp.result {
    color: var(--green);
    background: var(--green-lo);
    border-color: #2d4a2d;
  }

  /* swap btn */
  .swap-btn {
    width: 38px; height: 38px;
    background: var(--bg3);
    border: 1px solid var(--border-hi);
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-mid);
    font-size: 1rem;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    flex-shrink: 0;
    align-self: center;
  }
  .swap-btn:hover {
    background: var(--border-hi);
    color: var(--white);
    border-color: var(--accent);
  }

  /* formula */
  .formula {
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 2px solid var(--dim);
    padding: 0.55rem 0.85rem;
    border-radius: 0 3px 3px 0;
  }
  .f-lbl {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.56rem; font-weight: 700;
    letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 0.18rem;
  }
  .f-txt {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.76rem; color: var(--text-mid);
  }

  /* ══ FOOTER ══════════════════════════════════ */
  footer {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 0.6rem;
    padding: 0.75rem 2rem;
    border-top: 1px solid var(--border);
    background: var(--bg2);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem; color: var(--text-dim);
    letter-spacing: 0.1em;
  }
  .ft-author { color: var(--amber); letter-spacing: 0.18em; }
  .ft-status { display: flex; align-items: center; gap: 0.5rem; }

  /* ══ RESPONSIVE ══════════════════════════════ */
  @media (max-width: 540px) {
    .instrument-bar { padding: 0 1rem; gap: 0.5rem; font-size: 0.6rem; }
    .sep { display: none; }
    .ibar-l .ib-item:nth-child(n+4) { display: none; }
    .card { padding: 1rem 0.9rem; }
    .fld-inp { font-size: 1.05rem; }
    h1 { font-size: 1.9rem; }
  }
</style>
</head>
<body>

<!-- ══ INSTRUMENT BAR ══ -->
<div class="instrument-bar">
  <div class="ibar-l">
    <div class="ib-item">
      <span class="ib-k">SYS</span>
      <span class="ib-v">SI→IMP</span>
    </div>
    <span class="sep">│</span>
    <div class="ib-item">
      <span class="ib-k">OP</span>
      <span class="ib-v">G.EVANGELISTA</span>

    <div class="ib-item">
      <span class="status-led"></span>

    </div>

      <span class="ib-k">CAT</span>
      <span class="ib-v">8</span>
    </div>
    <span class="sep">│</span>
    <div class="ib-item">
      <span class="ib-k">CONV</span>

    </div>

  <div class="ibar-r">
    <div class="clock" id="clock">--:--:--</div>

</div>

<!-- ══ HEADER ══ -->
<header>
  <div class="hdr-eyebrow">◈ Strumento di Conversione Unità di Misura ◈</div>
  <h1>SI <span class="div">/</span> <b>Imperial</b></h1>
  <div class="hdr-meta">
    <div class="meta-pill">VER <b>2.0</b></div>
    <div class="author-badge">Giacomo Evangelista</div>
    <div class="meta-pill">28 CONVERSIONI</div>
  </div>
</header>

<!-- ══ TABS ══ -->
<div class="tabs-wrap">
  <div class="tabs" id="tabBar"></div>
</div>

<!-- ══ CONTENT ══ -->
<main id="mainContent"></main>

<!-- ══ FOOTER ══ -->
<footer>
  <div class="ft-author">▸ GIACOMO EVANGELISTA</div>
  <div>CALCOLI LOCALI · NESSUN SERVER RICHIESTO</div>
  <div class="ft-status"><span class="status-led"></span>SISTEMA ATTIVO</div>
</footer>

<script>
// ── Live clock ──────────────────────────────────────────────
(function tickClock() {
  const el = document.getElementById('clock');
  function tick() {
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    el.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  tick();
  setInterval(tick, 1000);
})();

// ── Data ────────────────────────────────────────────────────
const cats = [
  { id:'lunghezza', label:'Lunghezza', icon:'📏', convs:[
    { name:'Chilometri → Miglia',    uF:'km',   uT:'mi',     fwd:v=>v*0.621371,  rev:v=>v/0.621371,  fml:'mi = km × 0.621371',        fmlR:'km = mi ÷ 0.621371' },
    { name:'Metri → Piedi',          uF:'m',    uT:'ft',     fwd:v=>v*3.28084,   rev:v=>v/3.28084,   fml:'ft = m × 3.28084',          fmlR:'m = ft ÷ 3.28084' },
    { name:'Centimetri → Pollici',   uF:'cm',   uT:'in',     fwd:v=>v/2.54,      rev:v=>v*2.54,      fml:'in = cm ÷ 2.54   [1 in = 2.54 cm]', fmlR:'cm = in × 2.54' },
    { name:'Metri → Iarde',          uF:'m',    uT:'yd',     fwd:v=>v*1.09361,   rev:v=>v/1.09361,   fml:'yd = m × 1.09361',          fmlR:'m = yd ÷ 1.09361' },
  ]},
  { id:'massa', label:'Massa', icon:'⚖️', convs:[
    { name:'Chilogrammi → Libbre',   uF:'kg',   uT:'lb',     fwd:v=>v*2.20462,   rev:v=>v/2.20462,   fml:'lb = kg × 2.20462',         fmlR:'kg = lb ÷ 2.20462' },
    { name:'Grammi → Once',          uF:'g',    uT:'oz',     fwd:v=>v/28.3495,   rev:v=>v*28.3495,   fml:'oz = g ÷ 28.3495   [1 oz = 28.3495 g]', fmlR:'g = oz × 28.3495' },
    { name:'Tonnellate → Short Ton', uF:'t',    uT:'ton',    fwd:v=>v*1.10231,   rev:v=>v/1.10231,   fml:'ton = t × 1.10231',         fmlR:'t = ton ÷ 1.10231' },
  ]},
  { id:'forza', label:'Forza', icon:'⚙️', convs:[
    { name:'Newton → Libbra-forza',      uF:'N',  uT:'lbf', fwd:v=>v*0.224809, rev:v=>v/0.224809, fml:'lbf = N × 0.224809',   fmlR:'N = lbf ÷ 0.224809' },
    { name:'Kilonewton → Libbra-forza',  uF:'kN', uT:'lbf', fwd:v=>v*224.809,  rev:v=>v/224.809,  fml:'lbf = kN × 224.809',   fmlR:'kN = lbf ÷ 224.809' },
    { name:'Newton → Oncia-forza',       uF:'N',  uT:'ozf', fwd:v=>v*3.59694,  rev:v=>v/3.59694,  fml:'ozf = N × 3.59694',    fmlR:'N = ozf ÷ 3.59694' },
  ]},
  { id:'pressione', label:'Pressione', icon:'◉', convs:[
    { name:'Pascal → PSI',         uF:'Pa',  uT:'psi',  fwd:v=>v/6894.757,  rev:v=>v*6894.757,  fml:'psi = Pa ÷ 6894.757   [1 psi = 6894.757 Pa]', fmlR:'Pa = psi × 6894.757' },
    { name:'Bar → PSI',            uF:'bar', uT:'psi',  fwd:v=>v*14.5038,   rev:v=>v/14.5038,   fml:'psi = bar × 14.5038',  fmlR:'bar = psi ÷ 14.5038' },
    { name:'Atmosfere → Pol. Hg',  uF:'atm', uT:'inHg', fwd:v=>v*29.9213,   rev:v=>v/29.9213,   fml:'inHg = atm × 29.9213', fmlR:'atm = inHg ÷ 29.9213' },
    { name:'Kilopascal → PSI',     uF:'kPa', uT:'psi',  fwd:v=>v*0.145038,  rev:v=>v/0.145038,  fml:'psi = kPa × 0.145038', fmlR:'kPa = psi ÷ 0.145038' },
  ]},
  { id:'velocita', label:'Velocità', icon:'◈', convs:[
    { name:'km/h → mph',   uF:'km/h', uT:'mph',  fwd:v=>v*0.621371, rev:v=>v/0.621371, fml:'mph = km/h × 0.621371', fmlR:'km/h = mph ÷ 0.621371' },
    { name:'m/s → mph',    uF:'m/s',  uT:'mph',  fwd:v=>v*2.23694,  rev:v=>v/2.23694,  fml:'mph = m/s × 2.23694',   fmlR:'m/s = mph ÷ 2.23694' },
    { name:'Nodi → mph',   uF:'kn',   uT:'mph',  fwd:v=>v*1.15078,  rev:v=>v/1.15078,  fml:'mph = kn × 1.15078',    fmlR:'kn = mph ÷ 1.15078' },
    { name:'m/s → ft/s',   uF:'m/s',  uT:'ft/s', fwd:v=>v*3.28084,  rev:v=>v/3.28084,  fml:'ft/s = m/s × 3.28084',  fmlR:'m/s = ft/s ÷ 3.28084' },
  ]},
  { id:'temperatura', label:'Temperatura', icon:'◇', convs:[
    { name:'Celsius → Fahrenheit', uF:'°C', uT:'°F', fwd:v=>v*9/5+32,             rev:v=>(v-32)*5/9,           fml:'°F = (°C × 9/5) + 32',            fmlR:'°C = (°F − 32) × 5/9' },
    { name:'Kelvin → Fahrenheit',  uF:'K',  uT:'°F', fwd:v=>(v-273.15)*9/5+32,    rev:v=>(v-32)*5/9+273.15,    fml:'°F = (K − 273.15) × 9/5 + 32',    fmlR:'K = (°F − 32) × 5/9 + 273.15' },
    { name:'Kelvin → Rankine',     uF:'K',  uT:'°R', fwd:v=>v*1.8,                rev:v=>v/1.8,                fml:'°R = K × 1.8',                    fmlR:'K = °R ÷ 1.8' },
  ]},
  { id:'potenza', label:'Potenza', icon:'⚡', convs:[
    { name:'Watt → Cavalli vapore', uF:'W',  uT:'hp',    fwd:v=>v/745.7,    rev:v=>v*745.7,    fml:'hp = W ÷ 745.7   [1 hp = 745.7 W]', fmlR:'W = hp × 745.7' },
    { name:'kW → Cavalli vapore',   uF:'kW', uT:'hp',    fwd:v=>v*1.34102,  rev:v=>v/1.34102,  fml:'hp = kW × 1.34102',  fmlR:'kW = hp ÷ 1.34102' },
    { name:'Watt → BTU/h',          uF:'W',  uT:'BTU/h', fwd:v=>v*3.41214,  rev:v=>v/3.41214,  fml:'BTU/h = W × 3.41214', fmlR:'W = BTU/h ÷ 3.41214' },
    { name:'kW → BTU/h',            uF:'kW', uT:'BTU/h', fwd:v=>v*3412.14,  rev:v=>v/3412.14,  fml:'BTU/h = kW × 3412.14', fmlR:'kW = BTU/h ÷ 3412.14' },
  ]},
  { id:'area', label:'Area', icon:'▣', convs:[
    { name:'m² → ft²',        uF:'m²',  uT:'ft²', fwd:v=>v*10.7639,  rev:v=>v/10.7639,  fml:'ft² = m² × 10.7639',  fmlR:'m² = ft² ÷ 10.7639' },
    { name:'km² → mi²',       uF:'km²', uT:'mi²', fwd:v=>v*0.386102, rev:v=>v/0.386102, fml:'mi² = km² × 0.386102', fmlR:'km² = mi² ÷ 0.386102' },
    { name:'Ettari → Acri',   uF:'ha',  uT:'ac',  fwd:v=>v*2.47105,  rev:v=>v/2.47105,  fml:'ac = ha × 2.47105',   fmlR:'ha = ac ÷ 2.47105' },
    { name:'cm² → in²',       uF:'cm²', uT:'in²', fwd:v=>v/6.4516,   rev:v=>v*6.4516,   fml:'in² = cm² ÷ 6.4516   [1 in² = 6.4516 cm²]', fmlR:'cm² = in² × 6.4516' },
  ]},
];

// ── State ───────────────────────────────────────────────────
const dir = {};

// ── Build UI ────────────────────────────────────────────────
const tabBar = document.getElementById('tabBar');
const main   = document.getElementById('mainContent');

cats.forEach((cat, ci) => {
  // tab
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (ci===0?' active':'');
  btn.innerHTML = `<span class="tab-icon">${cat.icon}</span>${cat.label}`;
  btn.addEventListener('click', () => switchTab(cat.id));
  tabBar.appendChild(btn);

  // panel
  const panel = document.createElement('div');
  panel.id = 'panel-' + cat.id;
  panel.className = 'category-panel' + (ci===0?' active':'');

  panel.innerHTML = `
    <div class="ph">
      <div class="ph-icon">${cat.icon}</div>
      <div class="ph-title">${cat.label}</div>
      <div class="ph-count">[ ${cat.convs.length} CONV ]</div>
    </div>
  `;

  cat.convs.forEach((c, vi) => {
    const k = `${cat.id}-${vi}`;
    dir[k] = 'fwd';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-hdr">
        <div class="c-icon">▸</div>
        <div class="c-name">${c.name}</div>
        <div class="c-dir" id="d-${k}">SI → IMP</div>
      </div>
      <div class="inp-row">
        <div class="fld">
          <div class="fld-lbl" id="lf-${k}">${c.uF}</div>
          <input class="fld-inp" type="number" id="if-${k}" placeholder="0.000" step="any">
          <div class="fld-unit" id="uf-${k}">${c.uF}</div>
        </div>
        <button class="swap-btn" id="sb-${k}" title="Inverti">⇄</button>
        <div class="fld">
          <div class="fld-lbl" id="lt-${k}">${c.uT}</div>
          <input class="fld-inp result" type="number" id="it-${k}" placeholder="—" readonly>
          <div class="fld-unit" id="ut-${k}">${c.uT}</div>
        </div>
      </div>
      <div class="formula">
        <div class="f-lbl">FORMULA</div>
        <div class="f-txt" id="fm-${k}">${c.fml}</div>
      </div>
    `;
    panel.appendChild(card);

    setTimeout(() => {
      const iF = document.getElementById(`if-${k}`);
      const iT = document.getElementById(`it-${k}`);
      const sb = document.getElementById(`sb-${k}`);

      iF.addEventListener('input', () => {
        const v = parseFloat(iF.value);
        if (isNaN(v)) { iT.value=''; return; }
        iT.value = +(dir[k]==='fwd' ? c.fwd(v) : c.rev(v)).toFixed(6);
      });

      sb.addEventListener('click', () => {
        dir[k] = dir[k]==='fwd' ? 'rev' : 'fwd';
        const f = dir[k]==='fwd';
        document.getElementById(`lf-${k}`).textContent = f ? c.uF : c.uT;
        document.getElementById(`uf-${k}`).textContent = f ? c.uF : c.uT;
        document.getElementById(`lt-${k}`).textContent = f ? c.uT : c.uF;
        document.getElementById(`ut-${k}`).textContent = f ? c.uT : c.uF;
        document.getElementById(`d-${k}`).textContent  = f ? 'SI → IMP' : 'IMP → SI';
        document.getElementById(`fm-${k}`).textContent = f ? c.fml : c.fmlR;
        const old = parseFloat(iT.value);
        iF.value = isNaN(old) ? '' : old;
        iT.value = isNaN(old) ? '' : +(f ? c.fwd(old) : c.rev(old)).toFixed(6);
        sb.style.transform = 'rotate(180deg)';
        setTimeout(()=>{ sb.style.transform=''; }, 220);
      });
    }, 0);
  });

  main.appendChild(panel);
});

// ── Tab switch ──────────────────────────────────────────────
function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', cats[i].id===id));
  document.querySelectorAll('.category-panel').forEach(p => p.classList.toggle('active', p.id==='panel-'+id));
}
</script>
</body>
</html>
